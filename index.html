<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Hockey Blog Checklist</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Header Section -->
    <header class="bg-slate-800 border-b border-slate-700 py-6 px-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-3xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-emerald-400">🏒 Hockey Blogger's Matchday Checklist</h1>
                <p class="text-xs text-slate-400 mt-1">Interactive guide to publishing a complete, high-quality game review.</p>
            </div>
            <button id="reset-btn" class="bg-slate-700 hover:bg-slate-600 text-xs font-semibold px-3 py-2 rounded-lg transition border border-slate-600">
                Reset All
            </button>
        </div>
        
        <!-- Progress Bar Container -->
        <div class="max-w-3xl mx-auto mt-4">
            <div class="flex justify-between text-xs font-medium text-slate-300 mb-1">
                <span id="progress-text">0 of 9 checklist items checked</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-emerald-500 h-full transition-all duration-300 w-0"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-8 space-y-8">

        <!-- Section 1: Pre-Game -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-sm">
            <h2 class="text-lg font-semibold text-emerald-400 mb-4 border-b border-slate-700 pb-2">1. Pre-Game Preparation</h2>
            <div class="space-y-3">
                <label class="flex items-start gap-3 cursor-pointer group">
                    <input type="checkbox" class="checklist-item mt-1 w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 bg-slate-900 border-slate-600">
                    <span class="text-sm text-slate-300 group-hover:text-slate-100">Verify starting goalies and confirmed line combinations.</span>
                </label>
                <label class="flex items-start gap-3 cursor-pointer group">
                    <input type="checkbox" class="checklist-item mt-1 w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 bg-slate-900 border-slate-600">
                    <span class="text-sm text-slate-300 group-hover:text-slate-100">Check injury reports and late-scratch updates.</span>
                </label>
                <label class="flex items-start gap-3 cursor-pointer group">
                    <input type="checkbox" class="checklist-item mt-1 w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 bg-slate-900 border-slate-600">
                    <span class="text-sm text-slate-300 group-hover:text-slate-100">Note historical context (head-to-head records, recent streaks).</span>
                </label>
            </div>
        </section>

        <!-- Section 2: In-Game Notes -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-sm">
            <h2 class="text-lg font-semibold text-emerald-400 mb-4 border-b border-slate-700 pb-2">2. In-Game Tracking</h2>
            <div class="space-y-3">
                <label class="flex items-start gap-3 cursor-pointer group">
                    <input type="checkbox" class="checklist-item mt-1 w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 bg-slate-900 border-slate-600">
                    <span class="text-sm text-slate-300 group-hover:text-slate-100">Track turning points (momentum shifts, crucial penalties, big saves).</span>
                </label>
                <label class="flex items-start gap-3 cursor-pointer group">
                    <input type="checkbox" class="checklist-item mt-1 w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 bg-slate-900 border-slate-600">
                    <span class="text-sm text-slate-300 group-hover:text-slate-100">Note special teams performance (Power Play & Penalty Kill efficiency).</span>
                </label>
                <label class="flex items-start gap-3 cursor-pointer group">
                    <input type="checkbox" class="checklist-item mt-1 w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 bg-slate-900 border-slate-600">
                    <span class="text-sm text-slate-300 group-hover:text-slate-100">Capture quotes or standout impressions from live broadcast.</span>
                </label>
            </div>
        </section>

        <!-- Section 3: Post-Game Publish -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-sm">
            <h2 class="text-lg font-semibold text-emerald-400 mb-4 border-b border-slate-700 pb-2">3. Post-Game Writeup & Publishing</h2>
            <div class="space-y-3">
                <label class="flex items-start gap-3 cursor-pointer group">
                    <input type="checkbox" class="checklist-item mt-1 w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 bg-slate-900 border-slate-600">
                    <span class="text-sm text-slate-300 group-hover:text-slate-100">Analyze advanced stats (Corshi, Fenwick, Expected Goals - xG).</span>
                </label>
                <label class="flex items-start gap-3 cursor-pointer group">
                    <input type="checkbox" class="checklist-item mt-1 w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 bg-slate-900 border-slate-600">
                    <span class="text-sm text-slate-300 group-hover:text-slate-100">Select Three Stars of the Game with short justifications.</span>
                </label>
                <label class="flex items-start gap-3 cursor-pointer group">
                    <input type="checkbox" class="checklist-item mt-1 w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 bg-slate-900 border-slate-600">
                    <span class="text-sm text-slate-300 group-hover:text-slate-100">Proofread headline, tags, and share link across social channels.</span>
                </label>
            </div>
        </section>

    </main>

    <footer class="text-center py-8 text-xs text-slate-500">
        Built for Hockey Bloggers · Hosted Free on GitHub Pages
    </footer>

    <!-- JavaScript for Interactivity and LocalStorage -->
    <script>
        const checkboxes = document.querySelectorAll('.checklist-item');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressPercent = document.getElementById('progress-percent');
        const resetBtn = document.getElementById('reset-btn');

        // Load saved state on startup
        function loadProgress() {
            const savedState = JSON.parse(localStorage.getItem('hockeyChecklistState')) || [];
            checkboxes.forEach((box, index) => {
                box.checked = savedState[index] || false;
            });
            updateProgress();
        }

        // Save state to local browser storage
        function saveProgress() {
            const state = Array.from(checkboxes).map(box => box.checked);
            localStorage.setItem('hockeyChecklistState', JSON.stringify(state));
            updateProgress();
        }

        // Recalculate progress numbers and bar width
        function updateProgress() {
            const total = checkboxes.length;
            const checkedCount = Array.from(checkboxes).filter(box => box.checked).length;
            const percent = Math.round((checkedCount / total) * 100);

            progressText.textContent = `${checkedCount} of ${total} checklist items checked`;
            progressPercent.textContent = `${percent}%`;
            progressBar.style.width = `${percent}%`;
        }

        // Event Listeners
        checkboxes.forEach(box => {
            box.addEventListener('change', saveProgress);
        });

        resetBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to reset all checked items?")) {
                localStorage.removeItem('hockeyChecklistState');
                checkboxes.forEach(box => box.checked = false);
                updateProgress();
            }
        });

        // Run on page load
        loadProgress();
    </script>
</body>
</html>
